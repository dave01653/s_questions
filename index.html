<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Juego de Español</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fdf2f8; margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: white; border-radius: 28px; box-shadow: 0 12px 30px rgba(0,0,0,0.08); width: 100%; max-width: 520px; padding: 24px; text-align: center; }
    .prompt-box { background: #eff6ff; border-radius: 20px; padding: 16px; margin-bottom: 20px; cursor: pointer; border: 2px solid #bfdbfe; }
    .prompt-box:active { background: #dbeafe; }
    .speaker-icon { font-size: 2rem; display: inline-block; margin-bottom: 4px; }
    h2 { margin: 4px 0 0; color: #1e3a8a; font-size: 1.5rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
    .choice-btn { background: #f8fafc; border: 3px solid #e2e8f0; border-radius: 22px; padding: 16px 8px; font-size: 1.1rem; font-weight: 700; color: #334155; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 0.1s; min-height: 110px; }
    .choice-btn:active { transform: scale(0.96); background: #f1f5f9; }
    .choice-btn.selected { border-color: #22c55e; background: #f0fdf4; color: #15803d; }
    .choice-emoji { font-size: 3rem; margin-bottom: 6px; }
    .banner { min-height: 50px; font-size: 1.25rem; font-weight: 700; color: #047857; margin-bottom: 14px; display: flex; align-items: center; justify-content: center; }
    .nav-btn { background: #6366f1; color: white; border: none; border-radius: 18px; padding: 14px 28px; font-size: 1.2rem; font-weight: bold; width: 100%; cursor: pointer; }
    .nav-btn:active { background: #4f46e5; }
    .voice-status { font-size: 0.8rem; color: #94a3b8; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="prompt-box" onclick="speak(questions[cur].q)">
      <div class="speaker-icon">🔊</div>
      <h2 id="qText">¿Cómo te llamas?</h2>
      <small style="color: #64748b;">(Toca para escuchar)</small>
    </div>

    <div class="grid" id="choicesGrid"></div>

    <div class="banner" id="feedback">Toca una opción</div>
    <button class="nav-btn" onclick="nextCard()">Siguiente Tarjeta ➡️</button>
    <div class="voice-status" id="voiceName">Buscando voz...</div>
  </div>

  <script>
    const questions = [
      {
        q: "¿Cómo te llamas?",
        choices: [
          { emoji: "👧", label: "Sofía", speech: "Me llamo Sofía." },
          { emoji: "🧒", label: "Gabriela", speech: "Me llamo Gabriela." },
          { emoji: "🐶", label: "Perrito", speech: "Me llamo perrito." },
          { emoji: "🐱", label: "Gatito", speech: "Me llamo gatito." }
        ]
      },
      {
        q: "¿Dónde vives?",
        choices: [
          { emoji: "🏡", label: "California", speech: "Yo vivo en California." },
          { emoji: "🏖️", label: "Playa", speech: "Yo vivo en la playa." },
          { emoji: "🏔️", label: "Montaña", speech: "Yo vivo en la montaña." },
          { emoji: "🏰", label: "Castillo", speech: "Yo vivo en un castillo." }
        ]
      },
      {
        q: "¿Cuántos años tienes?",
        choices: [
          { emoji: "4️⃣🎂", label: "4 años", speech: "Tengo cuatro años." },
          { emoji: "6️⃣🎂", label: "6 años", speech: "Tengo seis años." },
          { emoji: "7️⃣🎂", label: "7 años", speech: "Tengo siete años." },
          { emoji: "5️⃣🎂", label: "5 años", speech: "Tengo cinco años." }
        ]
      },
      {
        q: "¿Cómo te sientes hoy?",
        choices: [
          { emoji: "😊", label: "Feliz", speech: "Me siento feliz." },
          { emoji: "😴", label: "Con sueño", speech: "Me siento con sueño." },
          { emoji: "🥳", label: "Animada", speech: "Me siento muy animada." },
          { emoji: "😢", label: "Triste", speech: "Me siento triste." }
        ]
      },
      {
        q: "¿Qué haces cuando te sientes feliz?",
        choices: [
          { emoji: "👨‍👩‍👧‍👧", label: "Con mi familia", speech: "Me siento feliz cuando estoy con mi familia." },
          { emoji: "💃", label: "Bailar", speech: "Bailo cuando estoy feliz." },
          { emoji: "🍦", label: "Comer helado", speech: "Como helado cuando estoy feliz." },
          { emoji: "🎨", label: "Dibujar", speech: "Dibujo cuando estoy feliz." }
        ]
      },
      {
        q: "¿Cuál es tu estación favorita?",
        choices: [
          { emoji: "🌸", label: "Primavera", speech: "Mi estación favorita es la primavera porque el clima es agradable." },
          { emoji: "☀️", label: "Verano", speech: "Mi estación favorita es el verano." },
          { emoji: "🍂", label: "Otoño", speech: "Mi estación favorita es el otoño." },
          { emoji: "❄️", label: "Invierno", speech: "Mi estación favorita es el invierno." }
        ]
      },
      {
        q: "¿Cuál es tu día favorito?",
        choices: [
          { emoji: "🍕🎉", label: "Viernes", speech: "Mi día favorito es el viernes." },
          { emoji: "🏖️", label: "Sábado", speech: "Mi día favorito es el sábado." },
          { emoji: "🥞", label: "Domingo", speech: "Mi día favorito es el domingo." },
          { emoji: "🎒", label: "Lunes", speech: "Mi día favorito es el lunes." }
        ]
      }
    ];

    let cur = 0;
    let selectedVoice = null;

    function pickBestVoice() {
      const voices = window.speechSynthesis.getVoices();
      if (!voices.length) return;

      // Filter for Spanish voices
      const esVoices = voices.filter(v => v.lang.toLowerCase().startsWith('es'));

      // Priority 1: Downloaded Enhanced/Premium/Siri voice
      let best = esVoices.find(v => 
        v.name.includes('Enhanced') || 
        v.name.includes('Premium') || 
        v.name.includes('Siri')
      );

      // Priority 2: Standard non-compact Spanish voice
      if (!best) {
        best = esVoices.find(v => !v.name.includes('Compact'));
      }

      // Priority 3: Any available Spanish voice
      if (!best && esVoices.length > 0) {
        best = esVoices[0];
      }

      selectedVoice = best;
      const statusLabel = document.getElementById('voiceName');
      if (selectedVoice) {
        statusLabel.innerText = "Voz: " + selectedVoice.name;
      }
    }

    if (typeof window !== 'undefined' && 'speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = pickBestVoice;
      pickBestVoice();
    }

    function speak(text) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if (selectedVoice) {
        u.voice = selectedVoice;
      }
      u.lang = 'es-MX';
      u.rate = 0.90; // Natural conversational cadence
      u.pitch = 1.0;
      window.speechSynthesis.speak(u);
    }

    function render() {
      const q = questions[cur];
      document.getElementById('qText').innerText = q.q;
      document.getElementById('feedback').innerText = "Toca una opción";
      const grid = document.getElementById('choicesGrid');
      grid.innerHTML = '';
      
      q.choices.forEach((c) => {
        const btn = document.createElement('div');
        btn.className = 'choice-btn';
        btn.innerHTML = `<span class="choice-emoji">${c.emoji}</span><span>${c.label}</span>`;
        btn.onclick = () => {
          document.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          document.getElementById('feedback').innerText = c.speech;
          speak(c.speech);
        };
        grid.appendChild(btn);
      });
      speak(q.q);
    }

    function nextCard() {
      cur = (cur + 1) % questions.length;
      render();
    }

    window.onload = () => {
      pickBestVoice();
      render();
    };
  </script>
</body>
</html>
